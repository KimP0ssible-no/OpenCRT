[env]
AWS_LC_SYS_PREBUILT_NASM = "1"
# The RDP helper's H.264 decoder (OpenH264) is C++: on Linux its runtime is
# linked statically by crates/opencrt-rdp/build.rs, so the binary still needs
# only glibc; cc must not add the shared libstdc++.
CXXSTDLIB_x86_64_unknown_linux_gnu = ""
# OpenH264 without its assembly: no nasm needed on any build machine (or for
# the universal macOS build), and plain C still decodes a full 1080p frame in
# well under 10 ms.
OPENH264_NO_ASM = "1"

# Link the C runtime into the Windows executables, so a fresh Windows needs
# no Visual C++ Redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Cross-built Windows executables (packaging/windows/build-cross.sh): the
# MinGW runtime (libgcc, winpthread) linked in too.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
