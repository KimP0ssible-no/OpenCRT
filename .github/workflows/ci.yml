name: CI

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux fontconfig headers and fonts for the renderer tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev fonts-dejavu-core minisign
      # The release job's signing script, with a throwaway key: it must sign,
      # and refuse a signature the given public key does not match.
      - name: Release signing script
        if: runner.os == 'Linux'
        run: |
          t=$(mktemp -d)
          echo test > "$t/SHA256SUMS"
          minisign -G -W -p "$t/k.pub" -s "$t/k.key"
          minisign -G -W -p "$t/other.pub" -s "$t/other.key"
          MINISIGN_KEY="$(cat "$t/k.key")" packaging/sign-release.sh "$t" "$t/k.pub"
          if MINISIGN_KEY="$(cat "$t/k.key")" packaging/sign-release.sh "$t" "$t/other.pub"; then
            echo "::error::signed with a key the public key does not match"; exit 1
          fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The RDP helper is its own workspace (see Cargo.toml).
      - run: cargo clippy --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target

  # Built against glibc 2.28 so the packages install, with nothing else, on
  # RHEL/Rocky/Alma 8+, Fedora, Debian 10+ and Ubuntu 20.04+.
  linux-packages:
    needs: test
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - name: Build tools
        run: dnf -y -q install gcc gcc-c++ make perl git
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo build --release --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target
      - name: Only glibc 2.28 and its own libraries
        run: |
          for b in opencrt opencrt-rdp ocrt; do
            needs=$(objdump -T target/release/$b | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            libs=$(objdump -p target/release/$b | awk '/NEEDED/{print $2}' | tr '\n' ' ')
            echo "$b: $needs; $libs"
            [ "$(printf '%s\n' "$needs" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ]
            ! echo "$libs" | grep -qvE '^((libc|libm|libdl|libpthread|librt|libgcc_s)\.so\.[0-9.]+|ld-linux-x86-64\.so\.2| )+$'
          done
      - name: Third-party licence notices
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate about.hbs -o target/THIRD-PARTY-NOTICES.html
          cargo about generate -c about.toml --manifest-path crates/opencrt-rdp/Cargo.toml about.hbs -o target/THIRD-PARTY-NOTICES-RDP.html
      - name: Debian and RPM packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p opencrt --no-build
          cargo generate-rpm -p crates/opencrt
      - uses: actions/upload-artifact@v7
        with:
          name: opencrt-Linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
      # The same binaries again for the Arch package.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            target/release/opencrt
            target/release/opencrt-rdp
            target/release/ocrt
            target/THIRD-PARTY-NOTICES.html
            target/THIRD-PARTY-NOTICES-RDP.html

  arch-package:
    needs: linux-packages
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: ci-linux
      - run: BIN_DIR="$PWD/ci-linux/release" NOTICES_DIR="$PWD/ci-linux" packaging/arch/makepkg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: opencrt-Arch
          path: dist/*.pkg.tar.zst

  # The package repositories GitHub Pages serves, built from the two latest
  # releases with a throwaway key: each distribution installs the older
  # version from them and must upgrade to the newer one.
  linux-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Packages of the two latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 2 --json tagName --jq '.[].tagName' > tags
          for tag in $(cat tags); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir pkgs -p '*.deb' -p '*.rpm' -p '*.pkg.tar.zst'
          done
      - name: Build the repositories
        run: |
          export GNUPGHOME="$PWD/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key 'OpenCRT test <test@example.invalid>' rsa3072 sign never
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ { print $10; exit }')
          docker run --rm -v "$PWD:/w" -w /w -e GNUPGHOME=/w/gnupg -e REPO_KEY_ID="$key" debian:trixie sh -euc '
            apt-get -qq update && apt-get -qq install -y --no-install-recommends apt-utils createrepo-c rpm pacman-package-manager makepkg libarchive-tools zstd gnupg > /dev/null
            packaging/linux/build-repos.sh pkgs repo http://127.0.0.1:8765'
      - name: Debian, Fedora, Rocky Linux 8 and Arch upgrade from them
        run: |
          new=$(sed -n 1p tags); old=$(sed -n 2p tags)
          packaging/linux/test-repos.sh repo "pkgs/opencrt-${old#v}-1-x86_64.pkg.tar.zst" "${old#v}" "${new#v}"

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo build --release --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target
      - name: Third-party licence notices
        shell: bash
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate about.hbs -o target/THIRD-PARTY-NOTICES.html
          cargo about generate -c about.toml --manifest-path crates/opencrt-rdp/Cargo.toml about.hbs -o target/THIRD-PARTY-NOTICES-RDP.html
      - name: Windows needs only system DLLs (C runtime linked in, see .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v objdump || { echo "::warning::no objdump on this runner; DLL check skipped"; exit 0; }
          for b in opencrt opencrt-rdp ocrt; do
            deps=$(objdump -p target/release/$b.exe | awk '/DLL Name/{print $3}' | tr 'A-Z' 'a-z' | sort -u | tr '\n' ' ')
            echo "$b.exe: $deps"
            ! echo "$deps" | grep -qE 'vcruntime|msvcp|ucrtbase|api-ms-win-crt'
          done
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y
          iscc packaging\windows\opencrt.iss
      # What Update Now does: the latest release installed per user, then the
      # new setup run with the in-app switches. It must replace the program in
      # the same place, stay closed without /RELAUNCH=1 and start with it.
      - name: Windows setup upgrades the latest release in place
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Wait for setup itself only: Start-Process -Wait would also wait for
          # the OpenCRT that /RELAUNCH=1 starts.
          function Setup($exe, [string[]] $switches) {
            Write-Host "$exe $switches"
            $p = Start-Process $exe -ArgumentList $switches -PassThru
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "$exe exited with $($p.ExitCode)" }
          }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-x64-setup.exe' --dir previous
          $old = (Get-ChildItem previous\*.exe)[0].FullName
          $new = (Get-ChildItem packaging\windows\Output\*.exe)[0].FullName
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Setup $old ($quiet + '/CURRENTUSER')
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F1D4C2E-8E0B-4E6B-9C5A-0C4C3D7A1E21}_is1'
          $dir = (Get-ItemProperty $key).InstallLocation
          Setup $new ($quiet + '/CLOSEAPPLICATIONS')
          if ((Get-FileHash "$dir\opencrt.exe").Hash -ne (Get-FileHash target\release\opencrt.exe).Hash) { throw "setup did not replace $dir\opencrt.exe" }
          if (Get-Process opencrt -ErrorAction SilentlyContinue) { throw 'OpenCRT started without /RELAUNCH=1' }
          Setup $new ($quiet + '/CLOSEAPPLICATIONS', '/RELAUNCH=1')
          Start-Sleep -Seconds 5
          $running = Get-Process opencrt -ErrorAction SilentlyContinue
          if (-not $running) { throw 'OpenCRT did not start again after /RELAUNCH=1' }
          $running | Stop-Process
      - name: Windows MSI (unattended / Group Policy installs)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset -y --no-progress
          cargo install cargo-wix --locked
          cargo wix -p opencrt --no-build --nocapture --bin-path "C:\Program Files (x86)\WiX Toolset v3.14\bin" -o target\wix\
      # One app for Apple silicon and Intel Macs: the runner builds arm64, so
      # build x86_64 too and join each program into a universal binary.
      - name: macOS app bundle and disk image (universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target --target x86_64-apple-darwin
          cargo install cargo-bundle
          cargo bundle --release -p opencrt
          app=target/release/bundle/osx/OpenCRT.app/Contents/MacOS
          for b in opencrt opencrt-rdp ocrt; do
            lipo -create target/release/$b target/x86_64-apple-darwin/release/$b -output $app/$b
            lipo $app/$b -verify_arch arm64 x86_64
          done
          hdiutil create -volname OpenCRT -srcfolder target/release/bundle/osx/OpenCRT.app -ov -format UDZO target/release/OpenCRT.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: opencrt-${{ runner.os }}
          path: |
            packaging/windows/Output/*.exe
            target/wix/*.msi
            target/release/OpenCRT.dmg
          if-no-files-found: ignore

  # A pushed tag vX.Y.Z publishes every package above as a GitHub Release.
  # The signing key is a secret of the "release" environment, which waits
  # for approval before this job runs.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, arch-package, package]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in Cargo.toml and the Windows installer
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$v\"" crates/opencrt/Cargo.toml
          grep -qx "#define AppVersion \"$v\"" packaging/windows/opencrt.iss
      - uses: actions/download-artifact@v8
        with:
          pattern: opencrt-*
          path: artifacts
      # SHA256SUMS.minisig is what OpenCRT's Update Now checks before it
      # installs anything (key: packaging/minisign.pub).
      - name: Checksums, signed
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          mkdir release
          find artifacts -type f -exec mv -t release {} +
          (cd release && sha256sum * > SHA256SUMS)
          packaging/sign-release.sh release
      # Build provenance for every file: gh attestation verify <file> --repo <this repo>.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "OpenCRT ${GITHUB_REF_NAME#v}" --generate-notes *
      # apt / dnf / zypper / pacman repositories of the three latest releases
      # (this one included), signed with the REPO_GPG_KEY secret; the pages
      # job publishes them.
      - name: Linux package repositories
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 3 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir pkgs -p '*.deb' -p '*.rpm' -p '*.pkg.tar.zst'
          done
          export GNUPGHOME="$PWD/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ { print $10; exit }')
          docker run --rm -v "$PWD:/w" -w /w -e GNUPGHOME=/w/gnupg -e REPO_KEY_ID="$key" debian:trixie sh -euc '
            apt-get -qq update && apt-get -qq install -y --no-install-recommends apt-utils createrepo-c rpm pacman-package-manager makepkg libarchive-tools zstd gnupg > /dev/null
            packaging/linux/build-repos.sh pkgs site https://kimp0ssible-no.github.io/OpenCRT'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
