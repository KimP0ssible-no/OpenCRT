name: CI

on:
  push:
    # Main builds the cache that pull requests and tags start from.
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only unless a job says otherwise (release and pages).
permissions:
  contents: read

# A newer merge makes an older main run moot; other runs never cancel.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'ci-main' || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that only touch Markdown or docs/ skip the builds; tags
  # always build everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The file list, not the diff: GitHub refuses diffs over 20000 lines.
            # Anything going wrong here means "build everything".
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' || true)
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      # A release tag carries the version (packaging/set-version.sh writes it
      # into the build) and, as its message, the release notes. Checked here,
      # before an hour of builds.
      - name: Release tag is newer than the latest release and has notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          latest="${latest#v}"
          echo "latest release $latest, this tag $v"
          [ "$v" != "$latest" ] && [ "$(printf '%s\n' "$latest" "$v" | sort -V | tail -1)" = "$v" ]
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          [ "$(echo "$ref" | jq -r .object.type)" = tag ] || { echo "::error::$GITHUB_REF_NAME is not an annotated tag: its message is the release notes"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message | tee notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::$GITHUB_REF_NAME has no release notes in its message"; exit 1; }

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Line numbers in backtraces, without full debug info: a smaller cache.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Dependencies and cargo-installed tools, as built by the last run on
      # main; pull requests and tags only read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/opencrt-rdp -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux fontconfig headers and fonts for the renderer tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev fonts-dejavu-core minisign
      # What a release tag runs first: the version in every file, and the
      # lock files still matching (main is put back afterwards).
      - name: Release version script
        shell: bash
        run: |
          sh packaging/set-version.sh 9.8.7
          cargo metadata --locked --format-version 1 > /dev/null
          (cd crates/opencrt/fuzz && cargo metadata --locked --format-version 1 > /dev/null)
          test "$(git diff --numstat | wc -l)" -eq 5
          git checkout -- .
      # The release job's signing script, with a throwaway key: it must sign,
      # and refuse a signature the given public key does not match.
      - name: Release signing script
        if: runner.os == 'Linux'
        run: |
          t=$(mktemp -d)
          echo test > "$t/SHA256SUMS"
          minisign -G -W -p "$t/k.pub" -s "$t/k.key"
          minisign -G -W -p "$t/other.pub" -s "$t/other.key"
          MINISIGN_KEY="$(cat "$t/k.key")" packaging/sign-release.sh "$t" "$t/k.pub"
          if MINISIGN_KEY="$(cat "$t/k.key")" packaging/sign-release.sh "$t" "$t/other.pub"; then
            echo "::error::signed with a key the public key does not match"; exit 1
          fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The RDP helper is its own workspace (see Cargo.toml).
      - run: cargo clippy --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target

  # deny.toml for both workspaces. Licences, bans and sources fail any run;
  # a new advisory only reports on a pull request or main (it is rarely the
  # change's doing) but fails a release tag. security.yml checks daily.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, crates/opencrt-rdp/Cargo.toml]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          command-arguments: bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: ${{ github.ref_type != 'tag' }}
        with:
          manifest-path: ${{ matrix.manifest }}
          command-arguments: advisories

  # Every fuzz target for a minute, from the corpus security.yml grows each
  # night: what once found a crash is tried again. A crash input is uploaded.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        crate: [opencrt, opencrt-rdp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # nightly-2026-11-01 cannot build zbus (E0391, an async drop query
      # cycle); back to @nightly once a newer nightly builds it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-31
      - if: matrix.crate == 'opencrt'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev
      # Shared with security.yml's nightly fuzzing; a new nightly starts afresh.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.crate }}
          workspaces: crates/${{ matrix.crate }}/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-fuzz --locked
      - uses: actions/cache/restore@v6
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus
          key: fuzz-corpus-${{ matrix.crate }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.crate }}-
      - working-directory: crates/${{ matrix.crate }}
        run: for t in $(cargo fuzz list); do cargo fuzz run "$t" -- -max_total_time=60; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.crate }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts

  # Built against glibc 2.28 so the packages install, with nothing else, on
  # RHEL/Rocky/Alma 8+, Fedora, Debian 10+ and Ubuntu 20.04+.
  linux-packages:
    needs: test
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - name: Build tools
        # libstdc++-static: the RDP helper links the C++ runtime of its H.264
        # decoder statically (crates/opencrt-rdp/build.rs).
        run: dnf -y -q --enablerepo=powertools install gcc gcc-c++ libstdc++-static make perl git
      - uses: actions/checkout@v7
      # Release tags: the version comes from the tag (main says 0.0.0).
      - name: Version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: sh packaging/set-version.sh "${GITHUB_REF_NAME#v}"
      - uses: dtolnay/rust-toolchain@stable
      # Dependencies and cargo-installed tools, as built by the last run on
      # main; pull requests and tags only read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/opencrt-rdp -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Skia (the interface renderer) needs a newer FreeType and C++ runtime
      # than AlmaLinux 8 has: a static FreeType and gcc-toolset-12.
      - name: FreeType and GCC for Skia
        run: sh packaging/linux/skia-deps.sh
      - run: PATH=/opt/rh/gcc-toolset-12/root/usr/bin:$PATH LIBRARY_PATH=/opt/freetype/lib64 cargo build --release
      - run: cargo build --release --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target
      # opencrt also links fontconfig and the C++ runtime (for Skia), both as
      # AlmaLinux 8 has them; the other two programs need glibc alone.
      - name: Only glibc 2.28, and for opencrt fontconfig and libstdc++ of GCC 8
        run: |
          for b in opencrt opencrt-rdp ocrt; do
            needs=$(objdump -T target/release/$b | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            cxx=$(objdump -T target/release/$b | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)
            libs=$(objdump -p target/release/$b | awk '/NEEDED/{print $2}' | tr '\n' ' ')
            echo "$b: $needs $cxx; $libs"
            [ "$(printf '%s\n' "$needs" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ]
            [ "$(printf '%s\n' "$cxx" GLIBCXX_3.4.25 | sort -V | tail -1)" = GLIBCXX_3.4.25 ]
            extra=; [ $b = opencrt ] && extra='|libstdc\+\+|libfontconfig'
            ! echo "$libs" | grep -qvE "^((libc|libm|libdl|libpthread|librt|libgcc_s$extra)\.so\.[0-9.]+|ld-linux-x86-64\.so\.2| )+$"
          done
      - name: Third-party licence notices
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate about.hbs -o target/THIRD-PARTY-NOTICES.html
          cargo about generate -c about.toml --manifest-path crates/opencrt-rdp/Cargo.toml about.hbs -o target/THIRD-PARTY-NOTICES-RDP.html
      - name: Debian and RPM packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p opencrt --no-build
          cargo generate-rpm -p crates/opencrt
      - uses: actions/upload-artifact@v7
        with:
          name: opencrt-Linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
      # The same binaries again for the Arch package.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            target/release/opencrt
            target/release/opencrt-rdp
            target/release/ocrt
            target/THIRD-PARTY-NOTICES.html
            target/THIRD-PARTY-NOTICES-RDP.html

  arch-package:
    needs: linux-packages
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      # Release tags: the version comes from the tag (main says 0.0.0).
      - name: Version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: sh packaging/set-version.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: ci-linux
      - run: BIN_DIR="$PWD/ci-linux/release" NOTICES_DIR="$PWD/ci-linux" packaging/arch/makepkg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: opencrt-Arch
          path: dist/*.pkg.tar.zst

  # The package repositories GitHub Pages serves, built from the two latest
  # releases with a throwaway key: each distribution installs the older
  # version from them and must upgrade to the newer one.
  linux-repos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Packages of the two latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 2 --json tagName --jq '.[].tagName' > tags
          for tag in $(cat tags); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir pkgs -p '*.deb' -p '*.rpm' -p '*.pkg.tar.zst'
          done
      - name: Build the repositories
        run: |
          export GNUPGHOME="$PWD/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key 'OpenCRT test <test@example.invalid>' rsa3072 sign never
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ { print $10; exit }')
          docker run --rm -v "$PWD:/w" -w /w -e GNUPGHOME=/w/gnupg -e REPO_KEY_ID="$key" debian:trixie sh -euc '
            apt-get -qq update && apt-get -qq install -y --no-install-recommends apt-utils createrepo-c rpm pacman-package-manager makepkg libarchive-tools zstd gnupg > /dev/null
            packaging/linux/build-repos.sh pkgs repo http://127.0.0.1:8765'
      - name: Debian, Fedora, Rocky Linux 8 and Arch upgrade from them
        run: |
          new=$(sed -n 1p tags); old=$(sed -n 2p tags)
          packaging/linux/test-repos.sh repo "pkgs/opencrt-${old#v}-1-x86_64.pkg.tar.zst" "${old#v}" "${new#v}"

  # On a tag, Windows signs with the Certum certificate: its login is a secret
  # of the "release" environment, so this job waits for approval there.
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      SIGN: ${{ matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      # Release tags: the version comes from the tag (main says 0.0.0).
      - name: Version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: sh packaging/set-version.sh "${GITHUB_REF_NAME#v}"
      - uses: dtolnay/rust-toolchain@stable
      # Dependencies and cargo-installed tools, as built by the last run on
      # main; pull requests and tags only read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/opencrt-rdp -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release
      - run: cargo build --release --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target
      - name: Third-party licence notices
        shell: bash
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate about.hbs -o target/THIRD-PARTY-NOTICES.html
          cargo about generate -c about.toml --manifest-path crates/opencrt-rdp/Cargo.toml about.hbs -o target/THIRD-PARTY-NOTICES-RDP.html
      - name: Windows needs only system DLLs (C runtime linked in, see .cargo/config.toml)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v objdump || { echo "::warning::no objdump on this runner; DLL check skipped"; exit 0; }
          for b in opencrt opencrt-rdp ocrt; do
            deps=$(objdump -p target/release/$b.exe | awk '/DLL Name/{print $3}' | tr 'A-Z' 'a-z' | sort -u | tr '\n' ' ')
            echo "$b.exe: $deps"
            ! echo "$deps" | grep -qE 'vcruntime|msvcp|ucrtbase|api-ms-win-crt'
          done
      # Windows shows these in each file's properties.
      - name: Windows executables name OpenCRT and its version
        if: runner.os == 'Windows'
        run: |
          $v = (Select-String -Path crates\opencrt\Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          foreach ($b in 'opencrt', 'opencrt-rdp', 'ocrt') {
            $info = (Get-Item "target\release\$b.exe").VersionInfo
            "$b.exe: $($info.ProductName) $($info.ProductVersion)"
            if ($info.ProductName -ne 'OpenCRT' -or $info.ProductVersion -ne $v) { throw "$b.exe has the wrong version information" }
          }
      # SimplySign Desktop logged in with the TOTP seed; the certificate's key
      # never leaves Certum's cloud. Source reviewed at this commit.
      - name: Certum SimplySign login
        if: env.SIGN == 'true'
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
      - name: Sign the Windows executables
        if: env.SIGN == 'true'
        run: |
          signtool sign /sha1 $env:CERTUM_CERT_THUMBPRINT /fd SHA256 /tr http://time.certum.pl /td SHA256 target\release\opencrt.exe target\release\opencrt-rdp.exe target\release\ocrt.exe
          if ($LASTEXITCODE) { throw 'signtool failed' }
      # Inno Setup signs the setup and the uninstaller it carries.
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y
          if ($env:SIGN -eq 'true') {
            iscc /DSign ('/Scertum=signtool sign /sha1 ' + $env:CERTUM_CERT_THUMBPRINT + ' /fd SHA256 /tr http://time.certum.pl /td SHA256 $f') packaging\windows\opencrt.iss
          } else {
            iscc packaging\windows\opencrt.iss
          }
          if ($LASTEXITCODE) { throw 'iscc failed' }
      - name: Windows MSI (unattended / Group Policy installs)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset -y --no-progress
          cargo install cargo-wix --locked
          cargo wix -p opencrt --no-build --nocapture --bin-path "C:\Program Files (x86)\WiX Toolset v3.14\bin" -o target\wix\
      # The portable version: the signed programs, the notices and portable.txt
      # (which keeps the settings beside the program), unpacked anywhere.
      - name: Windows portable zip
        if: runner.os == 'Windows'
        run: |
          $v = (Select-String -Path crates\opencrt\Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $dir = 'target\portable\OpenCRT'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\opencrt.exe, target\release\opencrt-rdp.exe, target\release\ocrt.exe, packaging\windows\portable.txt, SLINT-LICENSE.md, crates\opencrt\ui\fonts\OFL.txt, target\THIRD-PARTY-NOTICES.html, target\THIRD-PARTY-NOTICES-RDP.html $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          Copy-Item NOTICE "$dir\NOTICE.txt"
          Compress-Archive -Path $dir -DestinationPath "target\portable\opencrt-$v-x64-portable.zip" -Force
          Expand-Archive "target\portable\opencrt-$v-x64-portable.zip" target\portable\check
          foreach ($f in 'opencrt.exe', 'opencrt-rdp.exe', 'ocrt.exe', 'portable.txt', 'LICENSE.txt') {
            if (-not (Test-Path "target\portable\check\OpenCRT\$f")) { throw "the portable zip lacks $f" }
          }
      - name: Sign the MSI, check every signature
        if: env.SIGN == 'true'
        run: |
          signtool sign /sha1 $env:CERTUM_CERT_THUMBPRINT /fd SHA256 /tr http://time.certum.pl /td SHA256 (Get-Item target\wix\*.msi).FullName
          if ($LASTEXITCODE) { throw 'signtool failed' }
          signtool verify /pa target\release\opencrt.exe target\release\opencrt-rdp.exe target\release\ocrt.exe (Get-Item packaging\windows\Output\*.exe).FullName (Get-Item target\wix\*.msi).FullName
          if ($LASTEXITCODE) { throw 'a Windows file is not signed' }
      # Logged out before anything built here runs.
      - name: Certum SimplySign logout
        if: always() && env.SIGN == 'true'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # v1
      # What Update Now does: the latest release installed per user, then the
      # new setup run with the in-app switches. It must replace the program in
      # the same place, stay closed without /RELAUNCH=1 and start with it.
      - name: Windows setup upgrades the latest release in place
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Wait for setup itself only: Start-Process -Wait would also wait for
          # the OpenCRT that /RELAUNCH=1 starts.
          function Setup($exe, [string[]] $switches) {
            Write-Host "$exe $switches"
            $p = Start-Process $exe -ArgumentList $switches -PassThru
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { throw "$exe exited with $($p.ExitCode)" }
          }
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-x64-setup.exe' --dir previous
          $old = (Get-ChildItem previous\*.exe)[0].FullName
          $new = (Get-ChildItem packaging\windows\Output\*.exe)[0].FullName
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Setup $old ($quiet + '/CURRENTUSER')
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F1D4C2E-8E0B-4E6B-9C5A-0C4C3D7A1E21}_is1'
          $dir = (Get-ItemProperty $key).InstallLocation
          Setup $new ($quiet + '/CLOSEAPPLICATIONS')
          if ((Get-FileHash "$dir\opencrt.exe").Hash -ne (Get-FileHash target\release\opencrt.exe).Hash) { throw "setup did not replace $dir\opencrt.exe" }
          if (Get-Process opencrt -ErrorAction SilentlyContinue) { throw 'OpenCRT started without /RELAUNCH=1' }
          Setup $new ($quiet + '/CLOSEAPPLICATIONS', '/RELAUNCH=1')
          Start-Sleep -Seconds 5
          $running = Get-Process opencrt -ErrorAction SilentlyContinue
          if (-not $running) { throw 'OpenCRT did not start again after /RELAUNCH=1' }
          $running | Stop-Process
      # One app for Apple silicon and Intel Macs: the runner builds arm64, so
      # build x86_64 too and join each program into a universal binary.
      - name: macOS app bundle and disk image (universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target --target x86_64-apple-darwin
          cargo install cargo-bundle --locked
          cargo bundle --release -p opencrt --bin opencrt
          bundle=target/release/bundle/osx/OpenCRT.app
          app=$bundle/Contents/MacOS
          for b in opencrt opencrt-rdp ocrt; do
            lipo -create target/release/$b target/x86_64-apple-darwin/release/$b -output $app/$b
            lipo $app/$b -verify_arch arm64 x86_64
          done
          plist=$bundle/Contents/Info.plist
          test "$(plutil -extract CFBundleExecutable raw $plist)" = opencrt
          plutil -extract NSLocalNetworkUsageDescription raw $plist
          iconutil -c iconset -o target/release/icon.iconset "$bundle/Contents/Resources/$(plutil -extract CFBundleIconFile raw $plist)"
          test -f target/release/icon.iconset/icon_512x512@2x.png
          test -f $bundle/Contents/Resources/LICENSE
          # Ad hoc: not notarised, but one sealed bundle that macOS's privacy
          # settings (Local Network) know as org.opencrt.OpenCRT.
          codesign --force --sign - $app/opencrt-rdp $app/ocrt
          codesign --force --sign - $bundle
          codesign --verify --strict --deep $bundle
          # The disk image: the app and a link to drag it onto.
          rm -rf target/release/dmg && mkdir target/release/dmg
          mv $bundle target/release/dmg/
          ln -s /Applications target/release/dmg/Applications
          hdiutil create -volname OpenCRT -srcfolder target/release/dmg -ov -format UDZO target/release/OpenCRT.dmg
      # The README's one-line install, which takes the latest release.
      - name: macOS install script
        if: runner.os == 'macOS'
        run: |
          sh packaging/macos/install.sh
          test -x /Applications/OpenCRT.app/Contents/MacOS/opencrt
          test -z "$(xattr -p com.apple.quarantine /Applications/OpenCRT.app 2>/dev/null)"
      - uses: actions/upload-artifact@v7
        with:
          name: opencrt-${{ runner.os }}
          path: |
            packaging/windows/Output/*.exe
            target/wix/*.msi
            target/portable/*.zip
            target/release/OpenCRT.dmg
          if-no-files-found: ignore

  # A pushed tag vX.Y.Z publishes every package above as a GitHub Release.
  # The one check main requires: everything passed, or was skipped because
  # the pull request only changes documentation.
  ci-ok:
    if: always()
    needs: [changes, test, deny, fuzz, linux-packages, arch-package, linux-repos, package]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
          [ "${{ needs.changes.result }}" = success ]

  # The signing key is a secret of the "release" environment, which waits
  # for approval before this job runs.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deny, fuzz, linux-packages, arch-package, package]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: opencrt-*
          path: artifacts
      # SHA256SUMS.minisig is what OpenCRT's Update Now checks before it
      # installs anything (key: packaging/minisign.pub).
      - name: Checksums, signed
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          mkdir release
          find artifacts -type f -exec mv -t release {} +
          (cd release && sha256sum * > SHA256SUMS)
          packaging/sign-release.sh release
      # Build provenance for every file: gh attestation verify <file> --repo <this repo>.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      # The notes say what changed in plain words: the annotated tag's
      # message, its wrapped lines joined.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Windows files are signed as the [Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy) describes."
            echo
            echo "## What's changed"
            echo
            tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message | perl -0pe 's/\s+\z/\n/; s/(?<!\n)\n(?![\n*-]|\z)/ /g'
          } > notes.md
          cat notes.md
          cd release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "OpenCRT ${GITHUB_REF_NAME#v}" --notes-file ../notes.md *
      # apt / dnf / zypper / pacman repositories of the three latest releases
      # (this one included), signed with the REPO_GPG_KEY secret; the pages
      # job publishes them.
      - name: Linux package repositories
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 3 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir pkgs -p '*.deb' -p '*.rpm' -p '*.pkg.tar.zst'
          done
          export GNUPGHOME="$PWD/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ { print $10; exit }')
          docker run --rm -v "$PWD:/w" -w /w -e GNUPGHOME=/w/gnupg -e REPO_KEY_ID="$key" debian:trixie sh -euc '
            apt-get -qq update && apt-get -qq install -y --no-install-recommends apt-utils createrepo-c rpm pacman-package-manager makepkg libarchive-tools zstd gnupg > /dev/null
            packaging/linux/build-repos.sh pkgs site https://kimp0ssible-no.github.io/OpenCRT'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url || steps.last.outputs.page_url }}
    # Since November 2026 Pages deployments sometimes stall in syncing_files
    # until the action's 10-minute cap (raising its timeout does not help). A
    # timed-out attempt is cancelled and a new one usually goes through, so
    # three 4-minute attempts instead of one 10-minute one.
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 240000
      - id: retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 240000
      - id: last
        if: steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 240000
