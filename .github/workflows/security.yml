name: Security

# Each night: advisories (the code does not change overnight but the
# advisory database does, so a failure can mean a shipped release depends on
# a vulnerable crate) and long fuzzing runs.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, crates/opencrt-rdp/Cargo.toml]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          command-arguments: advisories

  # Each fuzz target for 20 minutes. The corpus it grows is saved for the
  # next night and for the minute-long runs in ci.yml.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        crate: [opencrt, opencrt-rdp]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - if: matrix.crate == 'opencrt'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev
      - run: cargo install cargo-fuzz --locked
      - uses: actions/cache/restore@v6
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus
          key: fuzz-corpus-${{ matrix.crate }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.crate }}-
      - working-directory: crates/${{ matrix.crate }}
        run: for t in $(cargo fuzz list); do cargo fuzz run "$t" -- -max_total_time=1200; done
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus
          key: fuzz-corpus-${{ matrix.crate }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.crate }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
