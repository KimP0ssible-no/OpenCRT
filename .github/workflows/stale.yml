name: Stale issues

# Issues that wait for the reporter: a reminder after 30 days without
# activity, closed 7 days after that. Only issues labelled "waiting for
# reporter"; any comment resets the clock. Pull requests are never touched.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          only-issue-labels: waiting for reporter
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          close-issue-reason: not_planned
          stale-issue-message: >-
            This issue waits for an answer from the reporter and had no
            activity for 30 days. If you still need it, reply here. Without a
            reply, it closes in 7 days.
          close-issue-message: >-
            Closed because nobody replied for 37 days. If you still need it,
            reply here or open a new issue.
