# cargo-about: the licences OpenCRT's dependencies may use. Generate the
# notices with `cargo about generate about.hbs` (see docs/packaging.md).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "GPL-3.0-only",
]
# Only what ships: dependencies of other platforms (wasm, Android) stay out.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
