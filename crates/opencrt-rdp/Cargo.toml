[package]
name = "opencrt-rdp"
version = "0.1.0"
edition = "2024"
description = "RDP helper for OpenCRT: one process per RDP tab, driven over stdin/stdout"
authors = ["Kim Attree"]
license = "Apache-2.0"

# Its own workspace: IronRDP and russh (in OpenCRT itself) pin incompatible
# versions of the same crypto crates. Build into the shared target folder:
#   cargo build --release --manifest-path crates/opencrt-rdp/Cargo.toml --target-dir target
[workspace]

[dependencies]
anyhow = "1.0.104"
# Devolutions IronRDP (MIT/Apache-2.0): connection sequence, NLA, session, codecs, input.
ironrdp = { version = "0.17.0", features = ["connector", "session", "graphics", "input", "pdu", "dvc", "displaycontrol", "cliprdr", "rdpsnd", "rdpdr", "svc"] }
ironrdp-egfx = { version = "0.3.0", features = ["openh264-bundled"] }
ironrdp-tls = { version = "0.2.2", features = ["rustls"] }
ironrdp-tokio = "0.10.0"
opencrt-rdp-proto = { path = "../rdp-proto" }
sha2 = "0.11"
tokio = { version = "1.53.2", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
# Same version ironrdp-tls returns; for the certificate fingerprint and subject.
x509-cert = "0.2.5"

# Remote sound: the system's own audio on Windows (WASAPI) and macOS (CoreAudio).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.17"

# Remote sound on Linux: ALSA, loaded at run time (dlopen) so the helper still
# needs only glibc; its default device feeds PulseAudio or PipeWire.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# For the local test server (examples/dev_rdp_server.rs, tests/session.rs).
async-trait = "0.1.92"
ironrdp = { version = "0.17.0", features = ["server"] }
ironrdp-server = { version = "0.13.0", features = ["helper"] }
openh264 = "0.9"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[profile.release]
strip = true
lto = "thin"

# IronRDP fixes not yet in a release: see vendor/*/OPENCRT.md.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
ironrdp-egfx = { path = "vendor/ironrdp-egfx" }
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }

[build-dependencies]
embed-resource = "3.0.12"
